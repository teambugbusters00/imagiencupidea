<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imagine Cup Idea Canvas</title><style>body{font:16px system-ui;max-width:900px;margin:30px auto;padding:0 16px;color:#17243a}label{display:block;margin:14px 0}textarea,input{display:block;width:100%;padding:10px;border:1px solid #bbc6d6;border-radius:8px}button{padding:12px 18px}pre{white-space:pre-wrap;background:#f2f5f9;padding:15px}</style></head><body><h1>Imagine Cup Idea Canvas</h1><p>Structure a competition idea before writing the pitch deck.</p><form id="f"><label>Project name<input name="name" required></label><label>Problem<textarea name="problem" required></textarea></label><label>Target users<textarea name="users" required></textarea></label><label>Solution<textarea name="solution" required></textarea></label><label>Innovation / differentiation<textarea name="innovation"></textarea></label><label>Validation plan<textarea name="validation"></textarea></label><label>Expected impact<textarea name="impact"></textarea></label><label>30-day MVP<textarea name="mvp"></textarea></label><button>Generate canvas</button></form><pre id="out"></pre><button id="save">Download canvas</button><script src="app.js"></script></body></html>
